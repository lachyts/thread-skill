# The fast tier on every PR (ADR 0073 d3): `make test-fast` against the PR's base, on both OSes (macOS stays in the
# gate for BSD vs GNU tools). ADR 0025 makes both jobs required status checks on master (strict), so a PR re-tests
# against the updated base before it can merge. The full suite runs on every push to master, split into shards, in
# full-suite.yml; master's red is that run's, never a PR's.
#
# The job names ARE the required-check contexts: "make test (ubuntu-latest)" and
# "make test (macos-latest)". Renaming the job, or changing a matrix value, leaves the old contexts
# unreported and every PR waiting forever. Change the protection in the same breath (ADR 0025 records
# the payload and the command). No job-level `if:` either: a skipped required job reports success.
# tests/ci-workflows.test.mjs pins all of this.
name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: make test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      # Full history, so the PR's base sha and `git merge-base` resolve: at depth 1 the selector reads FULL.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # next-action.py reads frontmatter with PyYAML; neither runner image guarantees it. setup-python
      # gives a pip that may install (the images' system pythons are externally managed).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml
      # THREAD_TEST_JOBS is 4: tests/run.sh's own cap (p23-4) would give these 3- and 4-vCPU runners 2, and on
      # 2026-10-28 8 made the 3-vCPU macOS runner slower (shell suites 16.5 min against 8 at 4), so it stays 4.
      # timeout-minutes sits where it does because a diff that touches a FULL path runs the whole suite, unsharded, in
      # this one job. Passing jobs from 2026-11-06 to 08 (all full runs, none cancelled) took 19 to 51 min on macOS
      # and 19 to 34 on ubuntu; 55 is 1.15 times the slowest, below the 60 it was raised to on 2026-11-07
      # (docs/audits/2026-11-09-test-suite.md § 4). It is one number for both OSes because merge-task's CI headroom
      # record reads only a plain whole number from this file (p43-5). The job names and the matrix stay as they are
      # (ADR 0025). A job past 80 % of it is a finding; a job cut at it is re-run once, then set aside as infra
      # (ADR 0073 d4).
      # THREAD_VERIFY_BASE is the PR's base sha. The checkout is the PR's merge ref, so its merge base with the base sha
      # is that sha and the diff is exactly what the PR lands; a base that moved after the event only grows the diff
      # (slower, never wrong). A FULL diff runs the full suite here, inside the same 55 minutes.
      - run: make test-fast
        env:
          THREAD_TEST_JOBS: "4"
          THREAD_VERIFY_BASE: ${{ github.event.pull_request.base.sha }}

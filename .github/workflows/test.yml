# The fast tier on every PR (ADR 0073 d3): `tests/run.sh --fast` against the PR's base, on ubuntu alone, split in three
# shards (ADR 0084 d4, p54-12). macOS left the PR checks by ADR 0084 d3 (p54-2) and runs only in full-suite.yml's
# shards, which still catch BSD vs GNU tool drift on master. ADR 0025 makes the job `test` a required status check on
# master (strict), so a PR re-tests against the updated base before it can merge. The full suite runs on every push to
# master, split into shards on both OSes, in full-suite.yml; master's red is that run's, never a PR's.
#
# The job `test` IS the required-check context: its literal name "make test (ubuntu-latest)", byte-identical to what
# the ruleset and merge-gate.py read. Renaming it leaves the old context unreported and every PR waiting forever: change
# the protection in the same breath (ADR 0025 records the payload and the command). It runs no tests itself. It is a
# roll-up: `needs: shard`, a job-level `if: ${{ always() }}` and nothing else, so it is never skipped (a skipped
# required job reports success) and runs whatever the shards concluded, and it fails unless `needs.shard.result` is
# success: a shard failed, cut at its limit or cancelled fails it. No other job-level `if:`: a shard carries none.
# The shards' names never start with `make test`, so neither merge-gate.py nor lead-integrate.py maps the required
# context onto a shard. lead-integrate.py (p54-11) reads `test` as a roll-up through the job it needs: merge-task's
# infra re-run classifies the shards' failed steps, a shard cut alone takes the CI timeout path, and the CI headroom
# record reads the slowest shard against the shard's own timeout-minutes, which is why that is a plain whole number.
# tests/ci-workflows.test.mjs pins all of this (W1-W3, W8).
name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  shard:
    name: fast tier (shard ${{ matrix.shard }}/3)
    strategy:
      # One shard's red never cancels the others, which would read as a false CI timeout.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    # The rule: about twice the slowest shard of a FULL diff (the worst case: the whole fast tier minus the Slow tier),
    # rounded up to a multiple of 5. 30 is full-suite.yml's ubuntu shard limit, held until this PR's shards are
    # measured. A shard whose week's median runs past 80 % of it is a finding (CONTEXT.md's CI headroom, ADR 0073 d5);
    # a shard cut at it is re-run once, then set aside as infra (ADR 0073 d4).
    timeout-minutes: 30
    steps:
      # Full history, so the PR's base sha and `git merge-base` resolve: at depth 1 the selector reads FULL.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # next-action.py reads frontmatter with PyYAML; neither runner image guarantees it. setup-python
      # gives a pip that may install (the images' system pythons are externally managed).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml
      # `--fast --shard K/3` selects as `make test-fast` does (its full-suite fallbacks and the Slow tier's filter
      # included), then runs shard K of that selection by tests/lib/shard.py's split, so the three shards together run
      # it exactly once (p54-10). The 3 in the run line must equal the length of the shard matrix (W2 pins both).
      # THREAD_TEST_JOBS is 4: tests/run.sh's own cap (p23-4) would give these 4-vCPU runners 2, and on 2026-10-28 8
      # made the 3-vCPU macOS runner (then in this check) slower (shell suites 16.5 min against 8 at 4), so it stays 4.
      # THREAD_VERIFY_BASE is the PR's base sha. The checkout is the PR's merge ref, so its merge base with the base sha
      # is that sha and the diff is exactly what the PR lands; a base that moved after the event only grows the diff
      # (slower, never wrong). Each shard selects from the same checkout and base, so the split is the same in all three.
      # THREAD_SKIP_SLOW=1 leaves the Slow tier (tests/fast-tier.map's SLOW lines, ADR 0084 d3) out of this check, a FULL
      # diff's full suite included, unless the PR edits a SLOW suite itself. The Mac's own verify (`make test-fast`
      # without it) and master's full-suite.yml still run the Slow tier.
      - run: bash tests/run.sh --fast --shard ${{ matrix.shard }}/3
        env:
          THREAD_TEST_JOBS: "4"
          THREAD_VERIFY_BASE: ${{ github.event.pull_request.base.sha }}
          THREAD_SKIP_SLOW: "1"

  test:
    name: make test (ubuntu-latest)
    needs: shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # Counts only once it starts, never while it waits on the shards.
    timeout-minutes: 5
    steps:
      # Reads only SHARDS, with no expression in it: tests/ci-workflows.test.mjs W8 runs this exact text.
      - shell: bash
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          [ "${SHARDS}" = success ] || { echo "::error::make test: the fast tier's shards concluded '${SHARDS:-none}', not success"; exit 1; }
          echo "make test: every shard of the fast tier passed"

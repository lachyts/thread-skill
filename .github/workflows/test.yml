# `make test` on every PR and every push to master. ADR 0025 makes both jobs required status checks
# on master (strict), so a PR re-tests against the updated base before it can merge.
#
# The job names ARE the required-check contexts: "make test (ubuntu-latest)" and
# "make test (macos-latest)". Renaming the job, or changing a matrix value, leaves the old contexts
# unreported and every PR waiting forever. Change the protection in the same breath (ADR 0025 records
# the payload and the command).
name: test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: make test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # next-action.py reads frontmatter with PyYAML; neither runner image guarantees it. setup-python
      # gives a pip that may install (the images' system pythons are externally managed).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml
      # tests/run.sh caps its background suites (p23-4) at max(2, ceil(cores / 3)), which is 2 on these 3- and
      # 4-vCPU runners and models about 2 to 2.5 min slower than today. 4 keeps both runners saturated (land.test.sh
      # fans out to 8 shards), so the shell phase models no longer than the uncapped run. If either job runs
      # over 12 min, raise this (8, or drop it for all at once) before touching timeout-minutes again; the job
      # names and the matrix stay as they are (ADR 0025).
      - run: make test
        env:
          THREAD_TEST_JOBS: "4"

# The fast tier on every PR (ADR 0073 d3): `make test-fast` against the PR's base, on both OSes (macOS stays in the
# gate for BSD vs GNU tools). ADR 0025 makes both jobs required status checks on master (strict), so a PR re-tests
# against the updated base before it can merge. The full suite runs on every push to master, split into shards, in
# full-suite.yml; master's red is that run's, never a PR's.
#
# The job names ARE the required-check contexts: "make test (ubuntu-latest)" and
# "make test (macos-latest)". Renaming the job, or changing a matrix value, leaves the old contexts
# unreported and every PR waiting forever. Change the protection in the same breath (ADR 0025 records
# the payload and the command). No job-level `if:` either: a skipped required job reports success.
# tests/ci-workflows.test.mjs pins all of this.
name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: make test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # Full history, so the PR's base sha and `git merge-base` resolve: at depth 1 the selector reads FULL.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # next-action.py reads frontmatter with PyYAML; neither runner image guarantees it. setup-python
      # gives a pip that may install (the images' system pythons are externally managed).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pyyaml
      # tests/run.sh caps its background suites (p23-4) at max(2, ceil(cores / 3)), which is 2 on these 3- and
      # 4-vCPU runners and models about 2 to 2.5 min slower than today. 4 keeps both runners saturated (land.test.sh
      # fans out to 8 shards), so the shell phase models no longer than the uncapped run. If either job runs
      # over 12 min, raise this (8, or drop it for all at once) before touching timeout-minutes again; the job
      # names and the matrix stay as they are (ADR 0025). On 2026-10-28 that was tried: 8 made the 3-vCPU macOS
      # runner slower (shell suites 16.5 min against 8 min at 4), while runner speed alone swung a passing macOS
      # job between 14 and over 25 min, cutting off master and five PRs with no test failing. So the cap stays 4.
      # timeout-minutes was 40 until 2026-11-07: by then the suite had grown so a passing macOS job took 31 to 39
      # min, and 7 of the last 40 macOS jobs (3 on master) were cancelled at exactly 40 with no test failing. 60 is
      # headroom while the suite is split across parallel jobs; it is no target, so a job near it is a finding.
      # p43-6 brings it back down once the fast tier and the split have been measured.
      # THREAD_VERIFY_BASE is the PR's base sha. The checkout is the PR's merge ref, so its merge base with the base sha
      # is that sha and the diff is exactly what the PR lands; a base that moved after the event only grows the diff
      # (slower, never wrong). A diff that touches a FULL path runs the full suite here, inside the same 60 minutes.
      - run: make test-fast
        env:
          THREAD_TEST_JOBS: "4"
          THREAD_VERIFY_BASE: ${{ github.event.pull_request.base.sha }}
